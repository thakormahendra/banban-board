<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <meta
      name="description"
      content="FlowBoard is a responsive Kanban task board built with React, Redux Toolkit, React Router, and Tailwind CSS."
    />
    <title>FlowBoard — Kanban Task Board</title>
    <script>
      (function () {
        var prefersDark =
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = prefersDark ? 'dark' : 'light';

        try {
          var stored = localStorage.getItem('flowboard.theme');
          var parsed = stored ? JSON.parse(stored) : null;
          if (parsed === 'dark' || parsed === 'light') theme = parsed;
        } catch (error) {
          theme = prefersDark ? 'dark' : 'light';
        }

        if (theme === 'dark') document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = theme;

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute(
            'content',
            theme === 'dark' ? '#020617' : '#f8fafc',
          );
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
